# CI Sphaera Commander Win64 (ТЗ §5).
#
# Ф1/Ф2: platform-тесты на ubuntu+windows; полный набор ядра offscreen;
# PyInstaller onedir + SPHAERA_SELFCHECK + артефакт .zip. Шаги, требующие
# ядро, gated на доступ к приватному Linux-репозиторию (секрет
# CORE_REPO_TOKEN или открытые репозитории).
#
# Требует, чтобы ОБА репозитория были на GitHub и переменные ниже
# указывали на них (сейчас remotes нет — workflow заработает после
# первого push владельцем).

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CORE_REPO: TDots9791/Sphaera-Commander     # фактический репозиторий-источник общего кода
  CORE_REF: main

jobs:
  platform:
    name: platform-тесты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Выкачать общий код (Linux-репозиторий)
        uses: actions/checkout@v4
        id: core
        continue-on-error: true
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.CORE_REF }}
          path: core
        # Приватный кросс-репо недоступен дефолтному GITHUB_TOKEN.
        # Включить полную проверку: секрет CORE_REPO_TOKEN (PAT с доступом
        # на чтение Linux-репо) + строка «token: ${{ secrets.CORE_REPO_TOKEN }}»
        # здесь, либо открытые репозитории.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sync_core
        if: steps.core.outcome == 'success'
        run: python sync_core.py --source core
      - name: sync_core --check
        if: steps.core.outcome == 'success'
        run: python sync_core.py --check --source core
      - name: Тесты платформенного слоя
        run: python -m unittest discover -s tests -v
      - name: Зависимости ядра
        if: steps.core.outcome == 'success'
        run: python -m pip install --disable-pip-version-check PySide6-Essentials pypdfium2 pypdf python-docx mammoth openpyxl python-pptx xlrd xlwt striprtf
      - name: Системные пакеты (Linux — Qt-библиотеки, gio, rclone)
        if: steps.core.outcome == 'success' && runner.os == 'Linux'
        run: sudo apt-get -y install libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-bin rclone
      - name: Системные пакеты (Windows — rclone, 7z в PATH)
        if: steps.core.outcome == 'success' && runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install rclone -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files\7-Zip"
      - name: Полный набор ядра (offscreen)
        if: steps.core.outcome == 'success'
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python -m unittest discover -s core/tests -v

  build:
    name: Сборка .exe (windows-latest)
    runs-on: windows-latest
    needs: platform
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Выкачать общий код (Linux-репозиторий)
        id: core
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.CORE_REF }}
          path: core
        # Приватный кросс-репо недоступен дефолтному GITHUB_TOKEN.
        # Включить: секрет CORE_REPO_TOKEN (PAT с доступом на чтение
        # Linux-репо) + строка «token: ${{ secrets.CORE_REPO_TOKEN }}»
        # в обоих checkout-шагах, либо открытые репозитории.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sync_core
        if: steps.core.outcome == 'success'
        run: python sync_core.py --source core
      - name: PyInstaller onedir
        if: steps.core.outcome == 'success'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File win64/build_exe.ps1
      - name: SELFCHECK замороженной сборки (дымовой)
        if: steps.core.outcome == 'success'
        shell: pwsh
        run: |
          $env:SPHAERA_SELFCHECK = "1"
          $p = Start-Process -FilePath "dist/SphaeraCommander/SphaeraCommander.exe" -Wait -PassThru
          exit $p.ExitCode
      - name: Артефакт .zip
        if: steps.core.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SphaeraCommander-win64
          path: dist/SphaeraCommander/
      - name: Версия ядра
        if: steps.core.outcome == 'success'
        id: ver
        shell: pwsh
        run: |
          $ver = ((Get-Content CORE_VERSION.txt) | Where-Object { $_ -like 'version=*' }) -replace '^version=', ''
          "version=$ver" >> $env:GITHUB_OUTPUT
      - name: WiX Toolset 6 (dotnet tool)
        if: steps.core.outcome == 'success'
        shell: pwsh
        run: |
          # пин на 6.x: v7 требует OSMF EULA/плату (WIX7015);
          # расширение тоже 6.x, версия — через запятую в имени (WIX0118)
          dotnet tool install --global wix --version "6.*"
          wix extension add -g WixToolset.UI.wixext,6.*
      - name: Установщик MSI (WiX)
        if: steps.core.outcome == 'success'
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          python win64/installer-harvest.py
          wix build -arch x64 -ext WixToolset.UI.wixext -culture ru-ru `
            -d AppVersion=${{ steps.ver.outputs.version }} `
            -out "dist-installer\SphaeraCommander-${{ steps.ver.outputs.version }}.msi" `
            win64\installer.wxs win64\.harvest.wxs
      - name: Артефакт установщика
        if: steps.core.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SphaeraCommander-win64-setup
          path: dist-installer/*.msi
      - name: Смок-тест установщика (install/update/uninstall)
        if: steps.core.outcome == 'success'
        shell: pwsh
        run: win64\installer-smoke.ps1
      - name: Доступ к ядру
        if: steps.core.outcome != 'success'
        shell: pwsh
        run: |
          Write-Host "::warning::Ядро недоступно дефолтному токену (приватный кросс-репо) — сборка пропущена. Включается секретом CORE_REPO_TOKEN или открытием репозиториев."
